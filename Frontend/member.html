  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Team Member</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

  <section id="view-member" class="view">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </span>
        TaskFlow
      </div>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Search tasks, members...">
      </div>

      <div class="topbar-right">
        <button class="icon-btn" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <div class="user-chip">
          <span class="avatar" id="member-avatar">SC</span>
          <div>
            <div class="name" id="member-name">Sara Chen</div>
            <div class="role">Team Member</div>
          </div>
        </div>
        <button class="logout-btn" id="member-logout-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </header>

    <main class="page">

      <div class="page-head">
        <h1>My Assigned Tasks</h1>
        <p class="sub"><span id="member-today-label">Monday, July 20, 2026</span> • <span id="task-count">0</span> tasks assigned to you</p>
      </div>

      <section class="split-layout">

        <!-- Task list -->
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>Task List</h2>
              <div class="sub">Click a task to view details</div>
            </div>
            <div class="badge-row">
              <span class="mini-badge blue" id="badge-inprogress">0 in progress</span>
              <span class="mini-badge amber" id="badge-pending">0 pending</span>
            </div>
          </div>

          <div class="table-wrap">
            <table class="task-table">
              <thead>
                <tr>
                  <th>Task Name</th>
                  <th>Assigned By</th>
                  <th>Deadline</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="member-task-table-body"></tbody>
            </table>
          </div>
        </div>

        <!-- Side stack: details + submit update -->
        <div class="side-stack">
          <div class="panel">
            <div class="panel-head-icon" style="margin-bottom: 16px;">
              <div class="icon-circle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <h2 style="margin:0;">Task Details</h2>
            </div>
            <div id="details-panel"></div>
          </div>

          <div class="panel" id="update-panel">
            <h2 style="margin: 0 0 14px;">Submit Update</h2>
            <form id="update-form">

              <div class="field">
                <label for="update-status">Status</label>

                <select id="update-status">
                  <option value="pending">Pending</option>
                  <option value="in_progress">In Progress</option>
                  <option value="completed">Completed</option>
                </select>
              </div>

              <div class="field">
                <label for="update-text">Work Description</label>

                <textarea
                  id="update-text"
                  placeholder="Share your progress or ask a question..."
                ></textarea>
              </div>

              <div class="attach-row">

                <button type="button" class="btn-ghost">
                  <svg width="15" height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                  </svg>
                  Attach File
                </button>

                <button
                  type="submit"
                  class="btn btn-primary small"
                >
                  Submit Update
                </button>

              </div>

            </form>
          </div>
        </div>

      </section>

  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      try {
        initApp();
      } catch (err) {
        console.error("TaskFlow failed to start:", err);
      }
    });
  </script>
  </body>
  </html>
